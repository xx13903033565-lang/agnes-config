name: file-analyzer
version: 0.1.0
description: >
  分析文本文件并生成结构化报告（行数、词频、编码检测）。
  演示 Deno 沙箱执行 + MCP 工具注册完整流程。
author: agnes-team
license: MIT

entrypoint: analyzer.ts

parameters:
  type: object
  properties:
    target_file:
      type: string
      description: 要分析的文件路径
    top_n:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
      description: 返回前 N 个高频词
  required:
    - target_file

dependencies:
  - deno/std@0.208.0

permissions:
  read:
    - /Users/billtse/Desktop/
  write: []
  net: false

triggers:
  - slash_command: /analyze-file
  - keyword: ["分析文件", "统计"]

tags: [analysis, text-processing, example]
created_at: 2026-10-12
updated_at: 2026-10-12
